<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NihonGo Deck - Flashcard IA v1.01</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="Aplicativo de flashcards para aprendizado de japonês">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="NihonGo Deck">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slideIn {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce {
            animation: bounce 0.6s ease-in-out;
        }
        .transition-all {
            transition: all 0.2s ease-in-out;
        }
        
        /* Safe Areas para iPhone notch */
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-left {
            padding-left: env(safe-area-inset-left);
        }
        .safe-right {
            padding-right: env(safe-area-inset-right);
        }
        
        /* Área de toque mínima para mobile */
        .touch-target {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Prevenir zoom em inputs no iOS */
        @media screen and (max-width: 768px) {
            input, textarea, select {
                font-size: 16px !important;
            }
        }
        
        /* Melhorias para teclado mobile */
        .keyboard-avoid {
            padding-bottom: env(keyboard-inset-height, 0);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Usa a mesma origem quando o front é servido pelo backend (ex.: http://localhost:8000).
        window.API_BASE_URL = window.API_BASE_URL || (typeof location !== 'undefined' ? location.origin : 'http://localhost:3000');
    </script>
    <script src="./version.js"></script>
    <script src="./src/services/apiService.js"></script>
    <script src="./jsonbinService.js"></script>
    <script src="./src/services/offlineStorage.js"></script>
    <script src="./src/services/syncManager.js"></script>
    <script src="./src/services/geolocationService.js"></script>
    <script src="./src/services/webauthnService.js"></script>
    <script src="./src/services/pushService.js"></script>
    <script type="text/babel" src="./app.jsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registrado com sucesso:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Falha ao registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
